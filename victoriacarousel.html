<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Carousel</title>
    <link rel="stylesheet" href="carousel.css" />
</head>
<body>
    <div class="carousel-container">
        <div class="carousel">
            <div class="carousel-slide">
                <img src="Victoria/DSC_2105 copy.jpg" alt="Image 1">
            </div>
            <div class="carousel-slide">
                <img src="Victoria/DSC_2112 copy.jpg" alt="Image 2">
            </div>
            <div class="carousel-slide">
                <img src="Victoria/DSC_2112_a copy.jpg" alt="Image 3">
            </div>
        </div>
        
        <button class="carousel-btn carousel-btn-prev">&#10094;</button>
        <button class="carousel-btn carousel-btn-next">&#10095;</button>
        
        <div class="carousel-indicators"></div>
    </div>

    <script src="carousel.js">
        
    </script>
</body>
</html>
