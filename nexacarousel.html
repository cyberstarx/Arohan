<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Carousel</title>
    <link rel="stylesheet" href="carousel.css" />
</head>
<body>
    <div class="carousel-container">
        <div class="carousel">
            <div class="carousel-slide">
                <img src="Nexa/DSC_0626 copy.jpg" alt="Image 1">
            </div>
            <div class="carousel-slide">
                <img src="Nexa/DSC_0626_a copy.jpg" alt="Image 2">
            </div>
            <div class="carousel-slide">
                <img src="Nexa/DSC_0692 copy.jpg" alt="Image 3">
            </div>
            <div class="carousel-slide">
                <img src="Nexa/DSC_0692_a copy.jpg" alt="Image 4">
            </div>
            <div class="carousel-slide">
                <img src="Nexa/DSC_0699 copy.jpg" alt="Image 5">
            </div>
            <div class="carousel-slide">
                <img src="Nexa/DSC_0699_a copy.jpg" alt="Image 6">
            </div>
            <div class="carousel-slide">
                <img src="Nexa/DSC_0717 copy.jpg" alt="Image 7">
            </div>
            <div class="carousel-slide">
                <img src="Nexa/DSC_0719 copy.jpg" alt="Image 8">
            </div>
            <div class="carousel-slide">
                <img src="Nexa/DSC_0768 (2) copy.jpg" alt="Image 9">
            </div>
            <div class="carousel-slide">
                <img src="Nexa/DSC_1335 copy.jpg" alt="Image 10">
            </div>
            <div class="carousel-slide">
                <img src="Nexa/DSC_3724 copy.jpg" alt="Image 11">
            </div>
        </div>
        
        <button class="carousel-btn carousel-btn-prev">&#10094;</button>
        <button class="carousel-btn carousel-btn-next">&#10095;</button>
        
        <div class="carousel-indicators"></div>
    </div>

    <script src="carousel.js">
        
    </script>
</body>
</html>
