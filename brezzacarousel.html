<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Carousel</title>
    <link rel="stylesheet" href="carousel.css" />
</head>
<body>
    <div class="carousel-container">
        <div class="carousel">
            <div class="carousel-slide">
                <img src="Brezza/001 copy.jpg" alt="Image 1">

            <div class="carousel-slide">
                <img src="Brezza/DSC_0324 copy.jpg" alt="Image 2">
            </div>
            <div class="carousel-slide">
                <img src="Brezza/DSC_0327 copy.jpg" alt="Image 3">
            </div>
            <div class="carousel-slide">
                <img src="Brezza/DSC_0613 copy.jpg" alt="Image 4">
            </div>
            <div class="carousel-slide">
                <img src="Brezza/DSC_0613_A copy.jpg" alt="Image 5">
            </div>
            <div class="carousel-slide">
                <img src="Brezza/DSC_0617 copy.jpg" alt="Image 6">
            </div>
            <div class="carousel-slide">
                <img src="Brezza/DSC_0695 copy.jpg" alt="Image 7">
            </div>
            <div class="carousel-slide">
                <img src="Brezza/DSC_0695_a copy.jpg" alt="Image 8">

            <div class="carousel-slide">

            </div>
            <div class="carousel-slide">
                <img src="Brezza/DSC_0716 copy.jpg" alt="Image 12">
            </div>
            <div class="carousel-slide">
                <img src="Brezza/DSC_0761 copy.jpg" alt="Image 13">
            </div>
            <div class="carousel-slide">
                <img src="Brezza/DSC_1332 copy.jpg" alt="Image 14">
            </div>
            
        </div>
        
        <button class="carousel-btn carousel-btn-prev">&#10094;</button>
        <button class="carousel-btn carousel-btn-next">&#10095;</button>
        
        <div class="carousel-indicators"></div>
    </div>

    <script src="carousel.js">
        
    </script>
</body>
</html>
