<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Carousel</title>
    <link rel="stylesheet" href="carousel.css" />
</head>
<body>
    <div class="carousel-container">
        <div class="carousel">
            <div class="carousel-slide">
                <img src="Yuva/image.jpg" alt="Image 1">
            </div>
            <div class="carousel-slide">
                <img src="Yuva/image1.jpg" alt="Image 2">
            </div>
            <div class="carousel-slide">
                <img src="Yuva/image2.jpg" alt="Image 3">
            </div>
            <div class="carousel-slide">
                <img src="Yuva/image3.jpg" alt="Image 4">
            </div>
            <div class="carousel-slide">
                <img src="Yuva/image4.jpg" alt="Image 5">
            </div>

            <div class="carousel-slide">
                <img src="Yuva/image5.jpg" alt="Image 6">
            </div>
            <div class="carousel-slide">
                <img src="Yuva/image6.jpg" alt="Image 7">
            </div>
            <div class="carousel-slide">
                <img src="Yuva/image7.jpg" alt="Image 8">
            </div>
            <div class="carousel-slide">
                <img src="Yuva/image8.jpg" alt="Image 9">
            </div>
            <div class="carousel-slide">
                <img src="Yuva/image9.jpg" alt="Image 10">
            </div>
            <div class="carousel-slide">
                <img src="Yuva_Black/DSC_2082 copy.jpg" alt="Image 11">
            </div>
            
            <div class="carousel-slide">
                <img src="Yuva_Black/DSC_2085 copy.jpg" alt="Image 12">
            </div>
            
            <div class="carousel-slide">
                <img src="Yuva_Black/DSC_2088 copy.jpg" alt="Image 13">
            </div>
            
            <div class="carousel-slide">
                <img src="Yuva_Black/DSC_2090 copy.jpg" alt="Image 14">
            </div>
            
            <div class="carousel-slide">
                <img src="Yuva_Black/DSC_2139 copy.jpg" alt="Image 15">
            </div>
        </div>
        
        <button class="carousel-btn carousel-btn-prev">&#10094;</button>
        <button class="carousel-btn carousel-btn-next">&#10095;</button>
        
        <div class="carousel-indicators"></div>
    </div>

    <script src="carousel.js">
        
    </script>
</body>
</html>
