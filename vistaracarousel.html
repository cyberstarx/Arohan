<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Carousel</title>
    <link rel="stylesheet" href="carousel.css" />
</head>
<body>
    <div class="carousel-container">
        <div class="carousel">
            <div class="carousel-slide">
                <img src="Vistara/DSC_0638 copy.jpg" alt="Image 1">
            </div>
            <div class="carousel-slide">
                <img src="Vistara/DSC_0697_a (2) copy.jpg" alt="Image 2">
            </div>
            <div class="carousel-slide">
                <img src="Vistara/DSC_0697_a copy.jpg" alt="Image 3">
            </div>
            <div class="carousel-slide">
                <img src="Vistara/DSC_0702 copy.jpg" alt="Image 4">
            </div>
            <div class="carousel-slide">
                <img src="Vistara/DSC_0706 copy.jpg" alt="Image 5">
            </div>
            <div class="carousel-slide">
                <img src="Vistara/DSC_1340 copy.jpg" alt="Image 6">
            </div>
            <div class="carousel-slide">
                <img src="Vistara/DSC_3723 copy.jpg" alt="Image 7">
            </div>
            <div class="carousel-slide">
                <img src="Vistara/DSC_5724 copy.jpg" alt="Image 8">
            </div>
            <div class="carousel-slide">
                <img src="Vistara/DSC_5724a copy.jpg" alt="Image 9">
            </div>
            <div class="carousel-slide">
                <img src="Vistara/DSC_5725 copy.jpg" alt="Image 10">
            </div>
        </div>
        
        <button class="carousel-btn carousel-btn-prev">&#10094;</button>
        <button class="carousel-btn carousel-btn-next">&#10095;</button>
        
        <div class="carousel-indicators"></div>
    </div>

    <script src="carousel.js">
        
    </script>
</body>
</html>
